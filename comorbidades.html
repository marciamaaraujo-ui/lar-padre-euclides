<div class="container">

<h1>Comorbidades Institucionais</h1>

<form id="formComorbidades">

<!-- ================= CARDIO ================= -->

<div class="grupo">

<h3>Doenças Cardiovasculares e Circulatórias</h3>

<div class="checkbox-grid">

<div class="checkbox-item"><input type="checkbox" id="has"><label for="has">Hipertensão Arterial (HAS)</label></div>
<div class="checkbox-item"><input type="checkbox" id="dislip"><label for="dislip">Dislipidemia</label></div>
<div class="checkbox-item"><input type="checkbox" id="venosa"><label for="venosa">Insuficiência Venosa</label></div>
<div class="checkbox-item"><input type="checkbox" id="arritmia"><label for="arritmia">Arritmia / Fibrilação Atrial</label></div>
<div class="checkbox-item"><input type="checkbox" id="cardio"><label for="cardio">Cardiopatia</label></div>
<div class="checkbox-item"><input type="checkbox" id="icc"><label for="icc">Insuficiência Cardíaca Crônica</label></div>
<div class="checkbox-item"><input type="checkbox" id="trombose"><label for="trombose">Trombose / Tromboembolismo</label></div>
<div class="checkbox-item"><input type="checkbox" id="ivp"><label for="ivp">Insuficiência Vascular Periférica</label></div>
<div class="checkbox-item"><input type="checkbox" id="aneurisma"><label for="aneurisma">Aneurisma</label></div>

</div>

</div>


<!-- ================= METABÓLICAS ================= -->

<div class="grupo">

<h3>Distúrbios Metabólicos e Endócrinos</h3>

<div class="checkbox-grid">

<div class="checkbox-item"><input type="checkbox" id="dm1"><label>Diabetes Mellitus Tipo I</label></div>
<div class="checkbox-item"><input type="checkbox" id="dm2"><label>Diabetes Mellitus Tipo II</label></div>
<div class="checkbox-item"><input type="checkbox" id="insulino"><label>Insulino-dependente</label></div>
<div class="checkbox-item"><input type="checkbox" id="hipot"><label>Hipotireoidismo</label></div>
<div class="checkbox-item"><input type="checkbox" id="obes"><label>Obesidade</label></div>
<div class="checkbox-item"><input type="checkbox" id="hiperuri"><label>Hiperuricemia</label></div>

</div>

</div>


<!-- ================= NEUROLÓGICAS ================= -->

<div class="grupo">

<h3>Doenças Neurológicas e Psiquiátricas</h3>

<div class="checkbox-grid">

<div class="checkbox-item"><input type="checkbox" id="alz"><label>Alzheimer</label></div>
<div class="checkbox-item"><input type="checkbox" id="park"><label>Parkinson</label></div>
<div class="checkbox-item"><input type="checkbox" id="avc"><label>AVC / AVE</label></div>
<div class="checkbox-item"><input type="checkbox" id="depressao"><label>Depressão</label></div>
<div class="checkbox-item"><input type="checkbox" id="ansiedade"><label>Ansiedade</label></div>
<div class="checkbox-item"><input type="checkbox" id="epilepsia"><label>Epilepsia</label></div>
<div class="checkbox-item"><input type="checkbox" id="esquiz"><label>Esquizofrenia</label></div>
<div class="checkbox-item"><input type="checkbox" id="encef"><label>Encefalopatia</label></div>
<div class="checkbox-item"><input type="checkbox" id="microangio"><label>Microangiopatia</label></div>

</div>

</div>

</form>

</div>


<script src="app.js"></script>

<script>

/* ================= SALVAR COMORBIDADES ================= */

function salvarComorbidades(){

const nome = localStorage.getItem("pacienteAtivo");

if(!nome){
alert("Selecione um paciente primeiro.");
return;
}

const banco = obterBanco();

if(!banco[nome]) banco[nome] = {};
if(!banco[nome].comorbidades) banco[nome].comorbidades = [];

const checks = document.querySelectorAll("#formComorbidades input[type='checkbox']");

let lista = [];

checks.forEach(c=>{
if(c.checked){
lista.push(c.labels[0].innerText);
}
});

banco[nome].comorbidades = lista;

salvarBanco(banco);

alert("Comorbidades salvas com sucesso.");

}


/* ================= CARREGAR COMORBIDADES ================= */

function carregarComorbidades(){

const nome = localStorage.getItem("pacienteAtivo");

if(!nome) return;

const banco = obterBanco();

if(!banco[nome]) return;

const lista = banco[nome].comorbidades || [];

const checks = document.querySelectorAll("#formComorbidades input[type='checkbox']");

checks.forEach(c=>{

const texto = c.labels[0].innerText;

if(lista.includes(texto)){
c.checked = true;
}

});

}


/* ================= INICIALIZAÇÃO ================= */

document.addEventListener("DOMContentLoaded",function(){

atualizarPacienteAtivoNavbar();
carregarComorbidades();

});

</script>

</body>
