<!-- ================= CONTEÚDO ================= -->

<div class="container">

<h1>Painel Epidemiológico</h1>

<section style="margin-top:40px;">

<h3>Top 5 Comorbidades</h3>

<canvas id="graficoComorb"></canvas>

<div id="mensagemSemDados" style="margin-top:15px;color:#6b7280;"></div>

</section>

</div>


<!-- ================= APP GLOBAL ================= -->

<script src="app.js"></script>


<!-- ================= SCRIPT DASHBOARD ================= -->

<script>

let graficoComorb = null;

document.addEventListener("DOMContentLoaded", function(){

    atualizarPacienteAtivoNavbar();
    renderizarDashboard();

});


function renderizarDashboard(){

    const banco = obterBanco();

    const msg = document.getElementById("mensagemSemDados");

    if(!banco || Object.keys(banco).length === 0){

        if(msg){
            msg.innerText = "Nenhum residente cadastrado no sistema.";
        }

        return;

    }

    let contagem = {};

    for(const nome in banco){

        const dados = banco[nome];

        if(!dados || !dados.comorbidades) continue;

        dados.comorbidades.forEach(c => {

            contagem[c] = (contagem[c] || 0) + 1;

        });

    }

    const top = Object.entries(contagem)
        .sort((a,b) => b[1] - a[1])
        .slice(0,5);

    const ctx = document.getElementById("graficoComorb")?.getContext("2d");

    if(!ctx) return;

    if(top.length === 0){

        if(msg){
            msg.innerText = "Ainda não existem comorbidades registradas.";
        }

        return;

    }

    if(graficoComorb){
        graficoComorb.destroy();
    }

    graficoComorb = new Chart(ctx,{

        type:"bar",

        data:{

            labels: top.map(i => i[0]),

            datasets:[{

                label:"Número de Residentes",

                data: top.map(i => i[1]),

                backgroundColor:"#22c55e"

            }]

        },

        options:{

            responsive:true,

            plugins:{
                legend:{ display:false }
            },

            scales:{
                y:{
                    beginAtZero:true,
                    ticks:{ stepSize:1 }
                }
            }

        }

    });

}

</script>
