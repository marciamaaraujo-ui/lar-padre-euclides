<!-- ================= CONTAINER ================= -->

<div class="container">

<h1>Painel Laboratorial Integrado</h1>

<select id="selectResidente" onchange="analisar()" style="margin-bottom:20px;"></select>

<table class="tabela-exames">

<thead>

<tr>
<th>Marcador</th>
<th>Resultado</th>
<th>Referência</th>
<th>Status</th>
<th>Interpretação</th>
</tr>

</thead>

<tbody id="corpoTabela"></tbody>

</table>


<h3>Laudo Clínico Nutricional Integrado</h3>

<textarea id="relatorioAutomatico" rows="16"></textarea>

</div>


<script>

/* ================= BASE DE EXAMES ================= */

const exames = [

{nome:"Hemoglobina", ref:[12,17.5], alto:"Policitemia.", baixo:"Anemia."},
{nome:"VCM", ref:[80,100], alto:"Macrocitose.", baixo:"Microcitose."},
{nome:"RDW", ref:[11.5,14.5], alto:"Anisocitose.", baixo:"Sem relevância isolada."},
{nome:"Leucócitos", ref:[4000,11000], alto:"Infecção/inflamação.", baixo:"Imunossupressão."},
{nome:"Neutrófilos", ref:[45,70], alto:"Infecção bacteriana.", baixo:"Risco infeccioso."},
{nome:"Eosinófilos", ref:[1,4], alto:"Alergia/parasitose.", baixo:"Estresse agudo."},
{nome:"Plaquetas", ref:[150000,450000], alto:"Inflamação ativa.", baixo:"Risco hemorrágico."},
{nome:"Glicemia Jejum", ref:[70,99], alto:"Hiperglicemia.", baixo:"Hipoglicemia."},
{nome:"HbA1c", ref:[0,5.7], alto:"Descontrole glicêmico.", baixo:"Possível interferência."},
{nome:"Albumina", ref:[3.5,5.0], alto:"Desidratação.", baixo:"Desnutrição/inflamação."},
{nome:"PCR", ref:[0,0.3], alto:"Inflamação sistêmica.", baixo:"Normal."},
{nome:"Ureia", ref:[10,50], alto:"Disfunção renal.", baixo:"Hipoproteica."},
{nome:"Creatinina", ref:[0.6,1.3], alto:"Disfunção renal.", baixo:"Sarcopenia."},
{nome:"Colesterol Total", ref:[0,190], alto:"Risco cardiovascular.", baixo:"Má absorção."},
{nome:"HDL", ref:[40,999], alto:"Protetor.", baixo:"Risco CV."},
{nome:"LDL", ref:[0,130], alto:"Risco aterosclerótico.", baixo:"Desnutrição."},
{nome:"Triglicerídeos", ref:[0,150], alto:"Risco pancreatite.", baixo:"Má absorção."},
{nome:"Vitamina D", ref:[20,999], alto:"Toxicidade rara.", baixo:"Deficiência óssea."},
{nome:"Vitamina B12", ref:[200,900], alto:"Excesso suplementar.", baixo:"Deficiência."},
{nome:"Ferritina", ref:[13,400], alto:"Inflamação fase aguda.", baixo:"Deficiência ferro."},
{nome:"Ferro Sérico", ref:[60,170], alto:"Sobrecarga ferro.", baixo:"Anemia ferropriva."},
{nome:"Zinco", ref:[70,120], alto:"Excesso suplementar.", baixo:"Baixa imunidade."},
{nome:"Potássio", ref:[3.5,5.1], alto:"Risco cardíaco.", baixo:"Perdas GI."},
{nome:"Cálcio", ref:[8.5,10.2], alto:"Hiperparatireoidismo.", baixo:"Deficiência Vit D."},
{nome:"TGO/TGP", ref:[0,40], alto:"Lesão hepática.", baixo:"Sem relevância."},
{nome:"TSH", ref:[0.45,4.5], alto:"Hipotireoidismo.", baixo:"Hipertireoidismo."}

];


/* ================= GERAR TABELA ================= */

function montarTabela(){

const tbody=document.getElementById("corpoTabela");

tbody.innerHTML="";

exames.forEach((ex,i)=>{

const linha=document.createElement("tr");

linha.innerHTML=`
<td>${ex.nome}</td>
<td><input type="number" step="any" id="res_${i}" oninput="analisar()"></td>
<td>${ex.ref[0]} - ${ex.ref[1]}</td>
<td id="status_${i}">-</td>
<td id="interp_${i}">-</td>
`;

tbody.appendChild(linha);

});

}

montarTabela();


/* ================= RESIDENTES ================= */

function carregarResidentes(){

const banco=JSON.parse(localStorage.getItem("bancoILPI"))||{};
const select=document.getElementById("selectResidente");

select.innerHTML='<option value="">Selecionar residente...</option>';

Object.keys(banco).forEach(nome=>{
select.innerHTML+=`<option value="${nome}">${nome}</option>`;
});

}

carregarResidentes();


/* ================= ANÁLISE ================= */

function analisar(){

let r={};
let alteracoes=0;

exames.forEach((ex,i)=>{

const val=parseFloat(document.getElementById("res_"+i).value);
const status=document.getElementById("status_"+i);
const interp=document.getElementById("interp_"+i);

if(isNaN(val)){
status.innerText="-";
interp.innerText="-";
return;
}

if(val>ex.ref[1]){

status.innerText="↑";
status.className="resultado-alto";
interp.innerText=ex.alto;

r[ex.nome]="↑";
alteracoes++;

}

else if(val<ex.ref[0]){

status.innerText="↓";
status.className="resultado-baixo";
interp.innerText=ex.baixo;

r[ex.nome]="↓";
alteracoes++;

}

else{

status.innerText="Normal";
status.className="resultado-normal";
interp.innerText="Dentro da normalidade.";

}

});


let laudo="LAUDO CLÍNICO NUTRICIONAL INTEGRADO\n\n";

if(alteracoes===0){
laudo+="Sem alterações laboratoriais relevantes.";
}
else{
laudo+="Foram identificadas "+alteracoes+" alterações laboratoriais.";
}

document.getElementById("relatorioAutomatico").value=laudo;

}

</script>


<script src="app.js"></script>

document.addEventListener("DOMContentLoaded",function(){
