<div class="container">

<h1>Avaliação Nutricional Integrada</h1>

<div id="painelAlertas" class="painel-alertas"></div>


<!-- ================= DADOS GERAIS ================= -->

<section class="secao">

<h2>Dados Gerais</h2>

<div class="form-group">

<label>Nome Completo</label>
<input type="text" id="nome">

</div>


<div class="form-group">

<label>Data de Nascimento</label>
<input type="date" id="dataNascimento">

</div>


<div class="form-group">

<label>Idade (automático)</label>
<input type="text" id="idade" class="auto" readonly>

</div>

</section>


<!-- ================= ANTROPOMETRIA ================= -->

<section class="secao">

<h2>Antropometria</h2>

<div class="form-group">
<label>Peso (kg)</label>
<input type="number" id="peso" step="any">
</div>

<div class="form-group">
<label>Altura (m)</label>
<input type="number" id="altura" step="any">
</div>

<div class="form-group">
<label>Peso Habitual (kg)</label>
<input type="number" id="pesoHab" step="any">
</div>

<div class="form-group">
<label>Perda de Peso (%)</label>
<input type="text" id="perdaPeso" class="auto" readonly>
</div>

<div class="form-group">
<label>Alerta de Perda de Peso</label>
<input type="text" id="alertaPerdaPeso" class="auto" readonly>
</div>

<div class="form-group">
<label>IMC</label>
<input type="text" id="imc" class="auto" readonly>
</div>

<div class="form-group">
<label>Classificação IMC</label>
<input type="text" id="classImc" class="auto" readonly>
</div>


<div class="grid">

<div class="form-group">
<label>Circunferência do Braço (cm)</label>
<input type="number" step="0.1" id="circBraco">
</div>

<div class="form-group">
<label>Circunferência da Panturrilha (cm)</label>
<input type="number" step="0.1" id="circPanturrilha">
</div>

<div class="form-group">
<label>Classificação Sarcopênica</label>
<input type="text" id="scoreSarcopenia" class="auto" readonly>
</div>

</div>

</section>


<!-- ================= NRS ================= -->

<section class="secao">

<h2>NRS 2002</h2>

<div class="form-group">

<label>Estado Nutricional</label>

<select id="nrsNutri">

<option value="0">Normal</option>
<option value="1">Perda leve</option>
<option value="2">Perda moderada</option>
<option value="3">Perda grave</option>

</select>

</div>


<div class="form-group">

<label>Gravidade da Doença</label>

<select id="nrsGrav">

<option value="0">Sem estresse</option>
<option value="1">Doença crônica</option>
<option value="2">Cirurgia grande</option>
<option value="3">Paciente crítico</option>

</select>

</div>


<div class="form-group">
<label>NRS Total</label>
<input type="text" id="nrsTotal" class="auto" readonly>
</div>

<div class="form-group">
<label>Classificação</label>
<input type="text" id="classNRS" class="auto" readonly>
</div>

</section>


<!-- ================= ICN ================= -->

<section class="secao">

<h2>Índice de Condição Nutricional (ICN)</h2>

<div class="form-group">
<label>Score ICN</label>
<input type="text" id="icn" class="auto" readonly>
</div>

<div class="form-group">
<label>Classificação</label>
<input type="text" id="classICN" class="auto" readonly>
</div>

</section>


<!-- ================= PES ================= -->

<section class="secao">

<h2>Diagnóstico Nutricional (PES)</h2>

<textarea id="parecer" rows="5" class="auto" readonly></textarea>

</section>

</div>

atualizarPacienteAtivoNavbar();

});

</script>

</body>
</html>
